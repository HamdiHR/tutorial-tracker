name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5544'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Version check (git and the live app must agree)
        run: node scripts/check-version.cjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - run: npm run build
      - run: npm run build:content
      - run: npm run build:engine
      - name: Unit, API and hosted tests
        run: npm run test:all
      - name: Install a browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
