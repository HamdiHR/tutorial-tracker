[package]
name = "tutorial-tracker-desktop"
version = "0.1.0"
description = "Desktop window for Tutorial Tracker (shares the local Node server with the browser version)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
