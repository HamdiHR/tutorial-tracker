<!doctype html>
<meta charset="utf-8">
<title>Tutorial Tracker</title>
<style>
  html,body{height:100%;margin:0;background:#0d1014;color:#8a93a3;font:15px system-ui,"Segoe UI",sans-serif;display:grid;place-items:center}
  main{text-align:center} b{color:#e4e7ec;font-size:18px}
  .s{width:26px;height:26px;border:3px solid #252b35;border-top-color:#7aa2ff;border-radius:50%;margin:16px auto;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}} #err{display:none;color:#e5534b;max-width:420px}
</style>
<main><b>Tutorial Tracker</b><div class="s"></div><div id="msg">Starting…</div>
<p id="err">The local server did not start. Install Node.js 22.13+ (nodejs.org) and make sure <code>start.cmd</code> works, then reopen this app.</p></main>
<script>
  var URL_ = 'http://127.0.0.1:4173/', tries = 0;
  (function tick() {
    fetch(URL_ + 'api/health', { mode: 'no-cors' }).then(function () { location.replace(URL_); }).catch(function () {
      if (++tries > 50) { document.getElementById('err').style.display = 'block'; document.getElementById('msg').textContent = ''; return; }
      setTimeout(tick, 300);
    });
  })();
</script>
